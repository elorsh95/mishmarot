name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
        env:
          FIREBASE_PROJECT_ID: demo-mishmarot

  # Deploys Firestore security rules and indexes, then creates base data (roles, settings,
  # shifts, locations, teams) and the first admin user if missing. Idempotent.
  # The app itself is deployed by Firebase App Hosting from the branch linked to each backend.
  deploy-firestore:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SERVICE_ACCOUNT: ${{ github.ref_name == 'main' && secrets.FIREBASE_SERVICE_ACCOUNT_PROD || secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
      PROJECT_ALIAS: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare credentials
        id: creds
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::warning::No service account secret configured for $PROJECT_ALIAS; skipping Firestore deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          PROJECT_ID=$(node -p "JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects['$PROJECT_ALIAS']")
          echo "FIREBASE_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
      # Each step runs even if another fails, so one missing IAM role doesn't block the rest;
      # the last step fails the job if anything failed.
      - name: Deploy indexes
        id: indexes
        if: steps.creds.outputs.skip != 'true'
        continue-on-error: true
        run: npx firebase deploy --only firestore:indexes --project "$PROJECT_ALIAS" --non-interactive
      - name: Deploy security rules
        id: rules
        if: steps.creds.outputs.skip != 'true'
        continue-on-error: true
        run: npx firebase deploy --only firestore:rules --project "$PROJECT_ALIAS" --non-interactive
      - name: Base data and first admin
        id: bootstrap
        if: steps.creds.outputs.skip != 'true'
        continue-on-error: true
        env:
          BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}
          BOOTSTRAP_ADMIN_NAME: ${{ secrets.BOOTSTRAP_ADMIN_NAME }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: npm run bootstrap
      - name: Auth e-mail links and template
        id: auth
        if: steps.creds.outputs.skip != 'true'
        continue-on-error: true
        env:
          # Production URL comes from the repository variable APP_URL_PROD once it exists.
          APP_URL: ${{ github.ref_name == 'main' && vars.APP_URL_PROD || 'https://mishmarot-dev--mishmarot-dev-cea4a.europe-west4.hosted.app' }}
        run: npm run configure-auth
      - name: Service account in use
        if: steps.creds.outputs.skip != 'true'
        run: node -e "console.log('client_email:', require(process.env.GOOGLE_APPLICATION_CREDENTIALS).client_email)"
      - name: Result
        if: steps.creds.outputs.skip != 'true'
        run: |
          echo "indexes: ${{ steps.indexes.outcome }}, rules: ${{ steps.rules.outcome }}, bootstrap: ${{ steps.bootstrap.outcome }}, auth: ${{ steps.auth.outcome }}"
          if [ "${{ steps.indexes.outcome }}" != "success" ] || [ "${{ steps.rules.outcome }}" != "success" ] || [ "${{ steps.bootstrap.outcome }}" != "success" ] || [ "${{ steps.auth.outcome }}" != "success" ]; then
            exit 1
          fi
